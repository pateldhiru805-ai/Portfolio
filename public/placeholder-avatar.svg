<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="35%" stop-color="#3b82f6"/>
      <stop offset="70%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="70%" stop-color="#090d1f"/>
      <stop offset="100%" stop-color="#040714"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="36" fill="url(#bgGlow)"/>

  <!-- Tech Grid Background lines -->
  <path d="M 50 100 L 350 100 M 50 200 L 350 200 M 50 300 L 350 300 M 100 50 L 100 350 M 200 50 L 200 350 M 300 50 L 300 350" stroke="#3b82f6" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Ambient Rings -->
  <circle cx="200" cy="180" r="115" stroke="url(#cyberGrad)" stroke-width="2.5" stroke-dasharray="8 6" fill="none" opacity="0.8"/>
  <circle cx="200" cy="180" r="95" stroke="#00f5ff" stroke-width="1.5" stroke-opacity="0.5" fill="none"/>

  <!-- Avatar Silhouette Icon -->
  <g fill="url(#cyberGrad)" filter="url(#neonGlow)">
    <!-- Head -->
    <circle cx="200" cy="150" r="42" fill="url(#cyberGrad)" opacity="0.9"/>
    <!-- Shoulders -->
    <path d="M 120 250 C 120 205, 160 195, 200 195 C 240 195, 280 205, 280 250 Z" fill="url(#cyberGrad)" opacity="0.85"/>
  </g>

  <!-- Monogram Initials Badge -->
  <circle cx="200" cy="180" r="28" fill="#060b1e" stroke="#00f5ff" stroke-width="2"/>
  <text x="200" y="188" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#00f5ff" text-anchor="middle">DM</text>

  <!-- Instructional Overlay Pill at bottom -->
  <rect x="50" y="318" width="300" height="42" rx="12" fill="#0c1024" stroke="url(#cyberGrad)" stroke-width="1.5"/>
  <text x="200" y="344" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">
    📸 Place photo at public/profile.jpg
  </text>
</svg>
